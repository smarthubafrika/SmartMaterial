plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.github.smarthubafrika.SmartMaterial'
version = '1.0.7'

android {
    namespace 'com.smarthub.smartmaterial'
    compileSdk 36

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.smarthubafrika.SmartMaterial'
                artifactId = 'smartmaterial'
                version = '1.0.7'
            }
        }
    }
}

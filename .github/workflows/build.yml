name: Build SmartMaterial

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source revision
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          echo "SmartProgress.java:"
          sed -n '30,40p' smartmaterial/src/main/java/com/smarthub/smartmaterial/progress/SmartProgress.java

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify Gradle
        run: gradle --version

      - name: Build library
        run: gradle :smartmaterial:assembleRelease

      - name: Publish to local Maven
        run: gradle :smartmaterial:publishReleasePublicationToMavenLocal

name: Build SmartMaterial

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify Gradle
        run: gradle --version

      - name: Build library
        run: gradle :smartmaterial:assembleRelease

      - name: Publish to local Maven
        run: gradle :smartmaterial:publishReleasePublicationToMavenLocal

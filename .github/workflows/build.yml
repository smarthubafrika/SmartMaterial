name: Build SmartMaterial

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library
        run: gradle :smartmaterial:assembleRelease
      - name: Build demo
        run: gradle -p demo :app:assembleDebug

name: Build SmartMaterial

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build library
        run: gradle :smartmaterial:assembleRelease

      - name: Publish check
        run: gradle :smartmaterial:publishReleasePublicationToMavenLocal
